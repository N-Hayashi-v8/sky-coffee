<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sky Coffee</title>
  <link href="css/destyle.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>

<body>
  <!-- ヘッダー -->
   <header class="header">
    <h1 class="logo">
      <a href="#">
        <img src="images/logo.png" alt="SKY COFFEE">
      </a>
    </h1>
   </header>

   <div class="main-visual">
    <picture>
      <source media="(min-width: 768px)" srcset="images/pc_main-visual.png">
      <img src="images/sp_main-visual.png" alt="複数の青いカップ">
    </picture>
   </div>

   <nav class="global-nav">
    <ul>
      <li><a href="#">menu</a></li>
      <li><a href="#">blog</a></li>
      <li><a href="#">access</a></li>
    </ul>
   </nav>

   <main>
      <section id="concept" class="concept">
        <div class="container">
          <div class="concept-container">
            <div class="concept-left">
              <img src="images/concept.png" alt="コーヒー">
            </div>
            <div class="concept-right">
              <div class="concept-subtitle">Concept</div>
              <h2 class="heading">心静かにコーヒーを</h2>
              <p class="concept-text">
                立ち止まって、<br>
                空の青さを眺めて、<br>
                一息つきましょう。
              </p>
            </div>
          </div>
        </div>
      </section>

      <!-- blog -->
      <section id="blog" class="blog">
        <div class="container">
          <h2 class="heading">blog<span class="blog-subtitle">ブログ</span></h2>
          <div class="blog-container">
            <article class="blog-card">
              <a href="#">
                <img src="images/thumbnail01.png" alt="コーヒーカー">
                <h3>コーヒーカー始めました。</h3>
                <time class="blog-date">2030.08.08</time>
              </a>
            </article>
            <article class="blog-card">
              <a href="#">
                <img src="images/thumbnail02.png" alt="コーヒーカー">
                <h3>濃厚クリーミーなミルクをどうぞ</h3>
                <time class="blog-date">2030.08.05</time>
              </a>
            </article>
            <article class="blog-card">
              <a href="#">
                <img src="images/thumbnail03.png" alt="コーヒーカー">
                <h3>Sky Coffeeのオリジナル曲が完成！無料ダウンロード可能です。</h3>
                <time class="blog-date">2030.08.02</time>
              </a>
            </article>
            <article class="blog-card">
              <a href="#">
                <img src="images/thumbnail04.png" alt="コーヒーカー">
                <h3>ハイキング用のコーヒーを販売中です。</h3>
                <time class="blog-date">2030.07.28</time>
              </a>
            </article>
            <article class="blog-card">
              <a href="#">
                <img src="images/thumbnail05.png" alt="コーヒーカー">
                <h3>ショップの壁を塗ってみました。</h3>
                <time class="blog-date">2030.07.27</time>
              </a>
            </article>
            <article class="blog-card">
              <a href="#">
                <img src="images/thumbnail06.png" alt="コーヒーカー">
                <h3>ブログを始めました。</h3>
                <time class="blog-date">2030.07.26</time>
              </a>
            </article>
          </div>

          <a class="blog-link" href="#">
            ブログ一覧
          </a>

        </div>
      </section>

   </main>


   <footer class="footer">
    <div class="logo">
      <a href="#">
        <img src="images/logo-white.png" alt="ロゴ" width="200" height="40">
      </a>
    </div>
    <div class="copyright">&copy;Sky Coffee</div>
  </footer>
</body>
</html>
